<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecanica</title>
    <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
    <main class="pagina-login">
        <section class="conteudo-login">
<div class="login-logo">
  <img src="img.mecanica/ChatGPT Image 1 de out. de 2026, 15_26_33.png" alt="Logo do sistema" />
</div>

            <form action="Login" method="post" class="login-form">
                <h1>Login</h1>

                <label for="usuario"><i class="fa-solid fa-user"></i></label>
                <input id="usuario" name="usuario" type="text" placeholder="Digite seu usuário">

                <label for="senha"><i class="fa-solid fa-lock"></i></label>
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha">

                <button ><a href="Menu.html">Entrar</a></button>
            </form>
        </section>
    </main>
</body>
</html>
